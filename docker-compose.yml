services:
  server-stat:
    ports:
      - "9090:9090"
    build: ./stats/server-stat

  stats-db:
    image: postgres:16.1
    container_name: postgres_stat
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=statsdb
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345

  main-service:
    ports:
      - "8080:8080"
    build: ./main-service/Dockerfile

  main-db:
    image: postgres:16.1
    container_name: postgres_main
