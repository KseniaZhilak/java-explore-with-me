services:
  stats-server:
    ports:
      - "9090:9090"
    build: ./stats/server-stat
    depends_on:
      stats-db:
        condition: service_healthy

  stats-db:
    image: postgres:16.1
    container_name: postgres_stat
    ports:
      - "5432:5432"
    volumes:
      - ./volumes/postgres:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=statsdb
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=12345
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U app -d app" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  ewm-service:
    ports:
      - "8080:8080"
    build: ./main-service
    depends_on:
      main-db:
        condition: service_healthy

  main-db:
    image: postgres:16.1
    container_name: postgres_main
    ports:
      - "5435:5432"
    environment:
      - POSTGRES_DB=maindb
      - POSTGRES_USER=main
      - POSTGRES_PASSWORD=12345
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U main -d maindb" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
