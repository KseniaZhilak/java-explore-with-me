server.port=8080
stats-server.url=${STATS_SERVER_URL:http://localhost:9090}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/maindb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:main}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:12345}
spring.sql.init.mode=always
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
spring.jpa.show-sql=true